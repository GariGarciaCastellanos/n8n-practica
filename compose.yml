services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  task-runner:
    image: n8nio/runners:${N8N_VERSION}
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://n8n:5678

  validador:
    build: ./validador
    ports:
      - "8000:8000"
    restart: unless-stopped

  extractor:
    build: ./extractor
    ports:
      - "8001:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODELO_IA: ${MODELO_IA:-claude-haiku-5-5}
      IMPORTE_MAX_AUTO: ${IMPORTE_MAX_AUTO:-1500}
      PRECIO_ENTRADA_EUR_MTOK: ${PRECIO_ENTRADA_EUR_MTOK:-}
      PRECIO_SALIDA_EUR_MTOK: ${PRECIO_SALIDA_EUR_MTOK:-}
    restart: unless-stopped

volumes:
  db-storage:
  n8n-data:
